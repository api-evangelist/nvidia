"""
NVIDIA GraphQL Schema
Covers GPU hardware, CUDA compute, AI/ML training and inference,
NGC registry, NIM microservices, DGX/HGX/OVX cloud infrastructure,
and developer management.

Sources:
  - https://developer.nvidia.com/
  - https://catalog.ngc.nvidia.com/
  - https://build.nvidia.com/
  - https://github.com/NVIDIA
"""

# ---------------------------------------------------------------------------
# Scalars
# ---------------------------------------------------------------------------

scalar DateTime
scalar JSON

# ---------------------------------------------------------------------------
# Enums
# ---------------------------------------------------------------------------

enum GPUArchitectureFamily {
  HOPPER
  ADA_LOVELACE
  AMPERE
  TURING
  VOLTA
  PASCAL
  MAXWELL
  KEPLER
}

enum MemoryType {
  HBM3
  HBM2E
  HBM2
  GDDR7
  GDDR6X
  GDDR6
  GDDR5
}

enum PrecisionMode {
  FP64
  FP32
  FP16
  BF16
  INT8
  INT4
  FP8
}

enum TrainingStatus {
  PENDING
  RUNNING
  COMPLETED
  FAILED
  CANCELLED
  PAUSED
}

enum InferenceStatus {
  ACTIVE
  INACTIVE
  SCALING
  ERROR
}

enum ContainerStatus {
  AVAILABLE
  DEPRECATED
  BETA
  GA
}

enum InstanceStatus {
  RUNNING
  STOPPED
  TERMINATED
  PENDING
  ERROR
}

enum NIMStatus {
  DEPLOYED
  DEPLOYING
  FAILED
  STOPPED
}

enum HealthStatus {
  HEALTHY
  DEGRADED
  UNHEALTHY
  UNKNOWN
}

enum WebhookEvent {
  TRAINING_STARTED
  TRAINING_COMPLETED
  TRAINING_FAILED
  INFERENCE_DEPLOYED
  INFERENCE_STOPPED
  MODEL_PUBLISHED
  INSTANCE_STARTED
  INSTANCE_STOPPED
}

# ---------------------------------------------------------------------------
# GPU Hardware Types
# ---------------------------------------------------------------------------

"""Physical GPU device with full hardware specification."""
type GPU {
  id: ID!
  name: String!
  model: GPUModel!
  architecture: GPUArchitecture!
  cudaCores: CUDACore!
  tensorCores: TensorCore!
  rtCores: RTCore
  vram: VRAM!
  memoryBandwidth: MemoryBandwidth!
  tdp: TDP!
  performanceMarks: [PerformanceMark!]!
  dlssSupport: DLSS
  rayTracingSupport: RayTracing
  nvlinkPorts: Int
  pcieLanes: Int
  releaseDate: DateTime
  msrp: Float
}

"""Logical GPU model identifier (e.g. H100, A100, RTX 4090)."""
type GPUModel {
  id: ID!
  name: String!
  sku: String
  architecture: GPUArchitecture!
  targetMarket: String
  computeCapability: String
  maxVRAMGB: Int
  precisionModes: [PrecisionMode!]!
  tdpWatts: Int
  releaseYear: Int
}

"""GPU micro-architecture (Hopper, Ada Lovelace, Ampere, etc.)."""
type GPUArchitecture {
  id: ID!
  name: String!
  family: GPUArchitectureFamily!
  processNode: String
  transistorBillions: Float
  dieAreaMM2: Float
  maxCUDAVersion: String
  features: [String!]!
  models: [GPUModel!]!
}

"""CUDA shader core count and configuration."""
type CUDACore {
  count: Int!
  clockMHz: Int
  fp32TFLOPS: Float
  fp64TFLOPS: Float
}

"""Tensor Core units for matrix multiply-accumulate operations."""
type TensorCore {
  generation: Int!
  count: Int!
  fp16TFLOPS: Float
  bf16TFLOPS: Float
  tf32TFLOPS: Float
  int8TOPS: Float
  fp8TFLOPS: Float
  sparsityMultiplier: Float
}

"""RT Core units for hardware ray-triangle intersection."""
type RTCore {
  generation: Int!
  count: Int!
  gigaraysPerSecond: Float
}

"""GPU video memory specification."""
type VRAM {
  capacityGB: Int!
  memoryType: MemoryType!
  busWidthBits: Int!
  clockMHz: Int
  eccSupported: Boolean!
}

"""GPU memory bandwidth measurement."""
type MemoryBandwidth {
  gbPerSecond: Float!
  l2CacheMB: Float
}

"""Thermal design power envelope."""
type TDP {
  maxWatts: Int!
  typicalWatts: Int
  minWatts: Int
  coolingRequirement: String
}

# ---------------------------------------------------------------------------
# Performance and Feature Types
# ---------------------------------------------------------------------------

"""Benchmark performance result for a GPU."""
type PerformanceMark {
  id: ID!
  name: String!
  score: Float!
  unit: String!
  workload: String
  precision: PrecisionMode
  gpu: GPU!
  measuredAt: DateTime
}

"""DLSS (Deep Learning Super Sampling) capability overview."""
type DLSS {
  supported: Boolean!
  maxVersion: String!
  dlss2: DLSS2
  dlss3: DLSS3
  supportedResolutions: [String!]!
}

"""DLSS 2 super-resolution capability."""
type DLSS2 {
  supported: Boolean!
  modes: [String!]!
  maxOutputResolution: String
}

"""DLSS 3 Frame Generation capability."""
type DLSS3 {
  supported: Boolean!
  frameGenerationSupported: Boolean!
  rayReconstructionSupported: Boolean!
  multiFrameGenerationSupported: Boolean
}

"""Hardware ray tracing capability."""
type RayTracing {
  supported: Boolean!
  rtCoreGeneration: Int
  maxGigaraysPerSecond: Float
  dlssRRSupported: Boolean
}

# ---------------------------------------------------------------------------
# AI/ML Compute Types
# ---------------------------------------------------------------------------

"""Multi-dimensional numerical tensor used in AI computation."""
type Tensor {
  id: ID!
  name: String
  shape: [Int!]!
  dtype: String!
  device: String
  sizeBytes: Int
}

"""Single inference request and its result."""
type Inference {
  id: ID!
  model: AIModel!
  endpoint: NIMEndpoint
  inputTokens: Int
  outputTokens: Int
  latencyMs: Float
  status: InferenceStatus!
  result: JSON
  createdAt: DateTime!
}

"""AI/ML training job running on GPU infrastructure."""
type TrainingJob {
  id: ID!
  name: String!
  model: AIModel!
  status: TrainingStatus!
  gpuCount: Int!
  gpuType: GPUModel!
  epochs: Int
  currentEpoch: Int
  batchSize: Int
  learningRate: Float
  checkpoints: [Checkpoint!]!
  metrics: Metrics
  startedAt: DateTime
  completedAt: DateTime
  cluster: Cluster
}

"""Generic AI/ML model asset."""
type Model {
  id: ID!
  name: String!
  version: String!
  description: String
  framework: String
  taskType: String
  inputFormat: String
  outputFormat: String
  sizeGB: Float
  publishedAt: DateTime
}

"""NVIDIA or partner AI foundation model."""
type AIModel {
  id: ID!
  name: String!
  displayName: String
  version: String!
  description: String
  architecture: String
  parameterCount: String
  contextLength: Int
  trainingDataCutoff: String
  supportedPrecisions: [PrecisionMode!]!
  isFoundationModel: Boolean!
  licenseType: String
  publisher: String
  tags: [String!]!
  ngcEntry: NGCRegistry
  nimAvailable: Boolean!
  publishedAt: DateTime
}

"""Large-scale foundation model (LLM, vision, multimodal, etc.)."""
type FoundationModel {
  id: ID!
  name: String!
  family: String!
  parameterCount: String
  architecture: String
  modality: [String!]!
  contextWindowTokens: Int
  trainingFLOPs: String
  supportedLanguages: [String!]!
  aiModel: AIModel!
}

"""Saved model weights snapshot during or after training."""
type Checkpoint {
  id: ID!
  trainingJob: TrainingJob!
  epoch: Int!
  step: Int
  loss: Float
  accuracy: Float
  storageUri: String!
  sizeGB: Float
  createdAt: DateTime!
}

"""Versioned artifact of a trained model."""
type ModelVersion {
  id: ID!
  model: AIModel!
  version: String!
  changelog: String
  isLatest: Boolean!
  isStable: Boolean!
  publishedAt: DateTime!
  deprecatedAt: DateTime
}

# ---------------------------------------------------------------------------
# NGC (NVIDIA GPU Cloud) Types
# ---------------------------------------------------------------------------

"""Top-level NGC catalog and registry context."""
type NGC {
  id: ID!
  organizations: [NGCOrganization!]!
  publicCollections: [NGCCollection!]!
  registry: NGCRegistry!
}

"""Entry in the NGC model, container, or resource registry."""
type NGCRegistry {
  id: ID!
  name: String!
  namespace: String!
  type: String!
  description: String
  latestVersion: String
  tags: [String!]!
  downloads: Int
  status: ContainerStatus!
  publishedAt: DateTime
  updatedAt: DateTime
}

"""Docker-compatible container image in NGC."""
type Container {
  id: ID!
  name: String!
  namespace: String!
  tag: String!
  digest: String
  sizeGB: Float
  baseImage: String
  cudaVersion: String
  framework: String
  status: ContainerStatus!
  pullCommand: String
  publishedAt: DateTime
  updatedAt: DateTime
}

"""Specific version of a model or resource in the NGC registry."""
type NGCTeam {
  id: ID!
  name: String!
  organization: NGCOrganization!
  members: [Developer!]!
  createdAt: DateTime!
}

"""NGC organization (company or personal namespace)."""
type NGCOrganization {
  id: ID!
  name: String!
  displayName: String
  teams: [NGCTeam!]!
  registries: [NGCRegistry!]!
  createdAt: DateTime!
}

"""Curated grouping of NGC resources (models, containers, etc.)."""
type NGCCollection {
  id: ID!
  name: String!
  description: String
  items: [NGCRegistry!]!
  tags: [String!]!
  publishedAt: DateTime
}

# ---------------------------------------------------------------------------
# NIM (NVIDIA Inference Microservices) Types
# ---------------------------------------------------------------------------

"""NIM deployment unit — a packaged, optimized AI model service."""
type NIM {
  id: ID!
  name: String!
  model: AIModel!
  version: String!
  status: NIMStatus!
  endpoints: [NIMEndpoint!]!
  config: NIMConfig!
  deployment: NIMDeployment
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""HTTP/gRPC endpoint exposed by a NIM instance."""
type NIMEndpoint {
  id: ID!
  nim: NIM!
  url: String!
  protocol: String!
  port: Int!
  healthCheckUrl: String
  authRequired: Boolean!
  status: HealthStatus!
}

"""Response payload from a NIM inference call."""
type NIMResponse {
  id: ID!
  endpoint: NIMEndpoint!
  statusCode: Int!
  latencyMs: Float!
  inputTokens: Int
  outputTokens: Int
  body: JSON
  createdAt: DateTime!
}

"""Runtime configuration for a NIM instance."""
type NIMConfig {
  maxConcurrentRequests: Int
  maxBatchSize: Int
  precision: PrecisionMode
  gpuMemoryFractionReserved: Float
  environmentVars: JSON
  customModelPath: String
}

"""Infrastructure specification for a NIM deployment."""
type NIMDeployment {
  id: ID!
  nim: NIM!
  instance: Instance!
  replicaCount: Int!
  autoScalingEnabled: Boolean!
  minReplicas: Int
  maxReplicas: Int
  deployedAt: DateTime!
}

# ---------------------------------------------------------------------------
# Cloud Infrastructure Types
# ---------------------------------------------------------------------------

"""NVIDIA cloud compute service context."""
type NVIDIAClouds {
  id: ID!
  regions: [String!]!
  instances: [Instance!]!
  clusters: [Cluster!]!
}

"""DGX system — NVIDIA's purpose-built AI supercomputer."""
type DGX {
  id: ID!
  model: String!
  gpuCount: Int!
  gpuType: GPUModel!
  totalVRAMTB: Float!
  nvlinkVersion: String
  nvSwitchCount: Int
  cpuSpec: CPUSpec!
  storageSpec: StorageSpec!
  networkSpec: Network!
  tdpKW: Float
}

"""HGX server platform for data center AI deployments."""
type HGX {
  id: ID!
  model: String!
  gpuCount: Int!
  gpuType: GPUModel!
  totalVRAMTB: Float!
  nvlinkVersion: String
  formFactor: String
  oemPartners: [String!]!
}

"""MGX modular GPU server reference architecture."""
type MGX {
  id: ID!
  model: String!
  gpuCount: Int!
  gpuType: GPUModel!
  formFactor: String
  pcieSlotsAvailable: Int
  oemPartners: [String!]!
}

"""OVX system optimized for NVIDIA Omniverse workloads."""
type OVX {
  id: ID!
  model: String!
  gpuCount: Int!
  gpuType: GPUModel!
  rtxSupport: Boolean!
  storageSpec: StorageSpec!
  networkSpec: Network!
}

"""Launch configuration template for a cloud GPU instance."""
type LaunchSpec {
  id: ID!
  name: String!
  gpuType: GPUModel!
  gpuCount: Int!
  vcpus: Int!
  memoryGB: Int!
  storageGB: Int!
  networkBandwidthGbps: Float
  image: String!
  region: String!
  pricePerHour: Float
}

"""Running cloud GPU compute instance."""
type Instance {
  id: ID!
  name: String!
  launchSpec: LaunchSpec!
  status: InstanceStatus!
  publicIP: String
  privateIP: String
  region: String!
  zone: String
  cluster: Cluster
  startedAt: DateTime
  stoppedAt: DateTime
}

"""Managed cluster of GPU compute nodes."""
type Cluster {
  id: ID!
  name: String!
  region: String!
  nodes: [Node!]!
  totalGPUs: Int!
  networkFabric: String
  infiniBandEnabled: Boolean!
  nvLinkEnabled: Boolean!
  kubernetesVersion: String
  createdAt: DateTime!
}

"""Individual compute node within a cluster."""
type Node {
  id: ID!
  hostname: String!
  cluster: Cluster!
  gpus: [GPU!]!
  cpuSpec: CPUSpec!
  storageSpec: StorageSpec!
  networkSpec: Network!
  status: InstanceStatus!
}

# ---------------------------------------------------------------------------
# Networking Types
# ---------------------------------------------------------------------------

"""Network interface and fabric specification for a node."""
type Network {
  id: ID!
  bandwidthGbps: Float!
  ports: Int!
  fabricType: String!
  infiniBand: InfiniBand
  nvLink: NVLink
}

"""InfiniBand high-speed interconnect for GPU clusters."""
type InfiniBand {
  generation: String!
  speedGbps: Float!
  ports: Int!
  hcaModel: String
  rdmaSupported: Boolean!
}

"""NVLink chip-to-chip interconnect between GPUs."""
type NVLink {
  generation: Int!
  totalBandwidthGBps: Float!
  linkCount: Int!
  p2pTransfersEnabled: Boolean!
}

"""NVSwitch high-bandwidth GPU-to-GPU switching fabric."""
type NVSwitch {
  id: ID!
  generation: Int!
  portCount: Int!
  totalBandwidthTBps: Float!
  latencyNs: Float
  clusterSupport: Int
}

