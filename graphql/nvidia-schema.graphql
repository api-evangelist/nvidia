# ---------------------------------------------------------------------------
# Developer Management Types
# ---------------------------------------------------------------------------

"""NVIDIA developer account."""
type Developer {
  id: ID!
  username: String!
  email: String!
  displayName: String
  organization: NGCOrganization
  apiKeys: [APIKey!]!
  tokens: [Token!]!
  webhooks: [Webhook!]!
  createdAt: DateTime!
  lastLoginAt: DateTime
}

"""API key for authenticating to NVIDIA developer services."""
type APIKey {
  id: ID!
  name: String!
  keyPrefix: String!
  developer: Developer!
  scopes: [String!]!
  isActive: Boolean!
  lastUsedAt: DateTime
  expiresAt: DateTime
  createdAt: DateTime!
}

"""Short-lived bearer token for NVIDIA API access."""
type Token {
  id: ID!
  developer: Developer!
  tokenType: String!
  scopes: [String!]!
  issuedAt: DateTime!
  expiresAt: DateTime!
  revoked: Boolean!
}

"""Webhook subscription for NVIDIA platform events."""
type Webhook {
  id: ID!
  developer: Developer!
  url: String!
  events: [WebhookEvent!]!
  secret: String
  isActive: Boolean!
  lastDeliveryAt: DateTime
  createdAt: DateTime!
}

"""Health check result for an NVIDIA service endpoint."""
type Health {
  service: String!
  status: HealthStatus!
  latencyMs: Float
  message: String
  checkedAt: DateTime!
}

"""Aggregated metrics for GPU, cluster, or inference workloads."""
type Metrics {
  id: ID!
  entityType: String!
  entityId: ID!
  gpuUtilizationPct: Float
  vramUsedGB: Float
  throughputRPS: Float
  avgLatencyMs: Float
  errorRate: Float
  powerDrawWatts: Float
  temperatureCelsius: Float
  sampledAt: DateTime!
}

# ---------------------------------------------------------------------------
# Root Query Type
# ---------------------------------------------------------------------------

type Query {
  # GPU Hardware
  gpu(id: ID!): GPU
  gpus(architectureFamily: GPUArchitectureFamily, limit: Int, offset: Int): [GPU!]!
  gpuModel(id: ID!): GPUModel
  gpuModels(limit: Int, offset: Int): [GPUModel!]!
  gpuArchitecture(id: ID!): GPUArchitecture
  gpuArchitectures: [GPUArchitecture!]!

  # AI Models
  aiModel(id: ID!): AIModel
  aiModels(taskType: String, publisher: String, limit: Int, offset: Int): [AIModel!]!
  foundationModel(id: ID!): FoundationModel
  foundationModels(modality: String, limit: Int, offset: Int): [FoundationModel!]!

  # Training
  trainingJob(id: ID!): TrainingJob
  trainingJobs(status: TrainingStatus, limit: Int, offset: Int): [TrainingJob!]!
  checkpoint(id: ID!): Checkpoint
  checkpoints(trainingJobId: ID!, limit: Int, offset: Int): [Checkpoint!]!

  # NGC
  ngcRegistry(id: ID!): NGCRegistry
  ngcRegistries(type: String, limit: Int, offset: Int): [NGCRegistry!]!
  container(id: ID!): Container
  containers(framework: String, cudaVersion: String, limit: Int, offset: Int): [Container!]!
  ngcOrganization(id: ID!): NGCOrganization
  ngcCollections(limit: Int, offset: Int): [NGCCollection!]!

  # NIM
  nim(id: ID!): NIM
  nims(status: NIMStatus, limit: Int, offset: Int): [NIM!]!
  nimEndpoint(id: ID!): NIMEndpoint
  nimResponse(id: ID!): NIMResponse

  # Infrastructure
  instance(id: ID!): Instance
  instances(status: InstanceStatus, region: String, limit: Int, offset: Int): [Instance!]!
  cluster(id: ID!): Cluster
  clusters(region: String, limit: Int, offset: Int): [Cluster!]!
  node(id: ID!): Node
  launchSpecs(gpuType: String, region: String, limit: Int, offset: Int): [LaunchSpec!]!

  # CUDA and Libraries
  cuda(version: String!): CUDA
  cudaVersions: [CUDAVersion!]!
  tensorRT(version: String): TensorRT

  # Triton
  tritonServer(id: ID!): TritonServer
  tritonServers(limit: Int, offset: Int): [TritonServer!]!
  tritonModel(id: ID!): TritonModel

  # Developer
  developer(id: ID!): Developer
  me: Developer
  apiKeys(developerId: ID!): [APIKey!]!
  webhooks(developerId: ID!): [Webhook!]!

  # Health and Metrics
  health(service: String!): Health
  metrics(entityType: String!, entityId: ID!, from: DateTime, to: DateTime): Metrics
}

# ---------------------------------------------------------------------------
# Root Mutation Type
# ---------------------------------------------------------------------------

type Mutation {
  # Training Jobs
  createTrainingJob(
    name: String!
    modelId: ID!
    gpuType: String!
    gpuCount: Int!
    epochs: Int
    batchSize: Int
    learningRate: Float
    clusterId: ID
  ): TrainingJob!
  cancelTrainingJob(id: ID!): TrainingJob!
  pauseTrainingJob(id: ID!): TrainingJob!
  resumeTrainingJob(id: ID!): TrainingJob!

  # NIM
  deployNIM(modelId: ID!, instanceId: ID!, config: JSON): NIM!
  stopNIM(id: ID!): NIM!
  scaleNIM(id: ID!, replicaCount: Int!): NIMDeployment!

  # Instances
  launchInstance(launchSpecId: ID!, name: String!): Instance!
  stopInstance(id: ID!): Instance!
  terminateInstance(id: ID!): Instance!

  # Developer
  createAPIKey(name: String!, scopes: [String!]!): APIKey!
  revokeAPIKey(id: ID!): APIKey!
  createWebhook(url: String!, events: [WebhookEvent!]!, secret: String): Webhook!
  deleteWebhook(id: ID!): Boolean!

  # Model Publishing
  publishModelVersion(modelId: ID!, version: String!, changelog: String): ModelVersion!
  deprecateModelVersion(id: ID!): ModelVersion!
}

# ---------------------------------------------------------------------------
# Root Subscription Type
# ---------------------------------------------------------------------------

type Subscription {
  trainingJobUpdated(id: ID!): TrainingJob!
  instanceStatusChanged(id: ID!): Instance!
  nimStatusChanged(id: ID!): NIM!
  metricsUpdated(entityType: String!, entityId: ID!): Metrics!
  healthChanged(service: String!): Health!
}
