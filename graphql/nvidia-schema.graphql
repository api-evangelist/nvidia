# ---------------------------------------------------------------------------
# Triton Inference Server Types
# ---------------------------------------------------------------------------

"""NVIDIA Triton Inference Server instance."""
type Triton {
  id: ID!
  version: String!
  servers: [TritonServer!]!
  supportedBackends: [String!]!
}

"""Running Triton Inference Server deployment."""
type TritonServer {
  id: ID!
  triton: Triton!
  host: String!
  httpPort: Int!
  grpcPort: Int!
  metricsPort: Int!
  models: [TritonModel!]!
  gpus: [GPU!]!
  status: HealthStatus!
  version: String!
  startedAt: DateTime
}

"""Model loaded and served by a Triton server."""
type TritonModel {
  id: ID!
  name: String!
  server: TritonServer!
  backend: String!
  config: ModelConfig!
  versions: [String!]!
  readyState: String!
  inputTensors: [Tensor!]!
  outputTensors: [Tensor!]!
}

"""Triton model configuration (config.pbtxt representation)."""
type ModelConfig {
  id: ID!
  modelName: String!
  backend: String!
  maxBatchSize: Int!
  dynamicBatchingEnabled: Boolean!
  preferredBatchSizes: [Int!]
  instanceGroupGPUCount: Int!
  instanceGroupKind: String!
  inputs: JSON
  outputs: JSON
}

"""Deployment profile for optimizing model serving."""
type DeploymentProfile {
  id: ID!
  name: String!
  gpuType: GPUModel!
  precision: PrecisionMode!
  maxBatchSize: Int!
  targetLatencyMs: Float
  targetThroughputRPS: Float
  tensorRTEnabled: Boolean!
  customConfig: JSON
}

